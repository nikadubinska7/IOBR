name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "iOBR Extractor" iobr_app.py
          Compress-Archive -Path "dist/iOBR Extractor.exe" -DestinationPath "dist/iOBR-Extractor-Windows.zip" -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: iOBR-Extractor-Windows
          path: dist/iOBR-Extractor-Windows.zip

      - name: Publish latest Windows release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Latest Windows Build
          body: Download `iOBR-Extractor-Windows.zip`, unzip it, and run `iOBR Extractor.exe`.
          files: dist/iOBR-Extractor-Windows.zip
          make_latest: true
